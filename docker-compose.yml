services:
  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: moments-db
    environment:
      POSTGRES_USER: moments
      POSTGRES_PASSWORD: moments
      POSTGRES_DB: moments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moments -d moments"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: moments-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
