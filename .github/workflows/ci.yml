name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: typecheck · lint · test · db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck --cache-dir=.turbo

      - name: Lint
        run: pnpm lint --cache-dir=.turbo

      - name: Test
        run: pnpm test --cache-dir=.turbo

      - name: DB migrate
        run: pnpm db:migrate

      - name: DB seed
        run: pnpm db:seed
