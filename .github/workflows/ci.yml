name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: typecheck · lint · test · db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: moments
          POSTGRES_PASSWORD: moments
          POSTGRES_DB: moments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moments -d moments"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://moments:moments@localhost:5432/moments
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck --cache-dir=.turbo

      - name: Lint
        run: pnpm lint --cache-dir=.turbo

      - name: Test
        run: pnpm test --cache-dir=.turbo

      - name: DB migrate
        run: pnpm db:migrate

      - name: DB seed
        run: pnpm db:seed
