name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    name: typecheck · lint · test · db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: DB migrate
        run: pnpm db:migrate

      - name: DB seed
        run: pnpm db:seed
