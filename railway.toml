# Railway deployment — Moments API (F8.2 / KAN-102)
# Root-level config: Railway project root is the monorepo root; the API
# service is built with Nixpacks and started via the workspace filter.
# Docs: https://railway.com/deploy/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @moments/api run build"

[deploy]
startCommand = "pnpm --filter @moments/api run start"
healthcheckPath = "/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[env]
NODE_ENV = "production"
LOG_LEVEL = "info"
# DATABASE_URL / REDIS_URL / SENTRY_DSN / POSTHOG_KEY / BETTERSTACK_SOURCE_TOKEN
# are injected from Railway variables (source: Doppler once provisioned).
